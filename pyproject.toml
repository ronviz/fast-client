[project]
name = "ronviz-fastclient"
version = "0.1.0"
authors = [
    { name = "Ron Weisenstern", email = "ron.weisenstern@gmail.com" }
]
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fastclient"
